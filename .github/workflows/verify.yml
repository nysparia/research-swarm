name: Verify implementation and source gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Python behavior
        run: python -m unittest discover -s tests -v
      - name: Check frontend behavior
        run: npm run test:frontend
      - name: Build frontend
        run: npm run build
      - name: Evaluate offline source gates (not scientific validation)
        run: python scripts/evaluate_semantics.py --output benchmark-results/host-gate-report.json
      - name: Upload auditable source gate results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-gates-${{ matrix.os }}
          path: benchmark-results/host-gate-report.json
          if-no-files-found: warn
